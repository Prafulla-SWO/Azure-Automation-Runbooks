name: SWOM365-DEV-PGHILDIYAL

on:
  workflow_dispatch:

jobs:
  Deploy:
    uses: ./.github/workflows/SWOM365-DEV-Branch-Azure-Deployment-Template.yml
    with:
      ResourceGroupName:     ${{ vars.SWOM365_DEV_PGHILDIYAL_RG }}
      AutomationAccountName: ${{ vars.SWOM365_DEV_PGHILDIYAL_AA }}
      StorageAccountName:    ${{ vars.SWOM365_DEV_PGHILDIYAL_ST }}
      RuntimeVersion:        '7.4'
    secrets:
      azureCredentials: ${{ secrets.REPOSITORYSECRET }}
