name: SWOM365-DEV-PGHILDIYAL

on:
  workflow_dispatch:        # started manually from the Actions tab

jobs:
  Deploy:
    uses: ./.github/workflows/SWOM365-DEV-Branch-Azure-Deployment-Template.yml    # SWOM365-DEV-Branch-Azure-Deployment-Template (confirm file name)
    with:
      ResourceGroupName:     ${{ vars.SWOM365_DEV_PGHILDIYAL_RG }}
      AutomationAccountName: ${{ vars.SWOM365_PGHILDIYAL_AA }}
      StorageAccountName:    ${{ vars.SWOM365_DEV_PGHILDIYAL_ST }}
      RuntimeVersion:        '7.4'                           # confirm value expected by the module deploy script
    secrets:
      azureCredentials: ${{ secrets.REPOSITORYSECRET }}   # confirm secret name
